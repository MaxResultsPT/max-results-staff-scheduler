<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Max Results | Staff Schedule</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f6fb;color:#11263f;font:16px system-ui,sans-serif}
header{background:#102941;color:white;padding:26px max(20px,calc((100% - 1120px)/2))}
header small{color:#b8daf8}h1{margin:4px 0}h2{margin:0 0 14px;font-size:1.2rem}h3{margin:0 0 8px}
main{max-width:1160px;margin:auto;padding:20px}.panel,article,details{background:white;border:1px solid #d2dfec;border-radius:12px;padding:16px}
nav,.actions,.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}nav{margin-bottom:16px}
button,input,select{font:inherit;color:inherit;border:1px solid #95a9be;border-radius:8px;background:white;padding:8px 12px;min-height:44px}
button{cursor:pointer}button.primary{background:#075da8;border-color:#075da8;color:white}button[disabled]{opacity:.55;cursor:wait}
label{display:grid;gap:5px}form{display:grid;gap:12px}form .row label{flex:1;min-width:130px}.login{max-width:420px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.day{min-width:0}.booking{border-left:3px solid #1682d4;padding-left:10px}
.booking + .booking{margin-top:14px}.muted{color:#4b6380}.roll{display:grid;gap:8px;margin:12px 0}
.roll label{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:8px;border-bottom:1px solid #e6edf5}
summary{cursor:pointer}.stack{display:grid;gap:12px}#notice{white-space:pre-wrap}pre{white-space:pre-wrap;font:inherit}
dialog{max-width:min(560px,calc(100% - 24px));width:100%;max-height:90vh;padding:22px;border:1px solid #aac1d9;border-radius:14px;color:inherit}
dialog::backdrop{background:#0c233d80}
nav button[aria-pressed="true"]{background:#102941;color:white;border-color:#102941}
.calendar-frame{overflow:auto;border:1px solid #d2dfec;border-radius:12px;background:white;max-height:74vh}
.week-calendar{display:grid;grid-template-columns:55px repeat(7,minmax(135px,1fr));min-width:1000px}
.calendar-heading{position:sticky;top:0;z-index:2;background:#f7faff;padding:12px 6px;border-bottom:1px solid #d2dfec;text-align:center;font-size:.85rem;font-weight:650}
.current-day{background:#dbeeff;color:#075da8}
.clock,.calendar-day{position:relative}.clock span{position:absolute;right:6px;color:#4b6380;font-size:.75rem}
.calendar-day{border-left:1px solid #d2dfec;background:repeating-linear-gradient(to bottom,#e7eef6 0 1px,transparent 1px 60px)}
.calendar-event{position:absolute;min-height:0;border:1px solid white;border-left:3px solid var(--event-ink);border-radius:5px;text-align:left;padding:3px 4px;overflow:hidden;background:var(--event-bg);color:var(--event-ink);font-size:.75rem;line-height:1.15;overflow-wrap:anywhere}
.calendar-roster{display:block;font-weight:600;margin-top:3px}
.calendar-legend{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.calendar-legend span{background:var(--event-bg);color:var(--event-ink);border-left:3px solid var(--event-ink);padding:4px 8px;border-radius:5px;font-size:.8rem}
.view-tabs{display:flex;gap:8px}
.schedule-menu{padding:0 12px;min-height:44px;position:relative}
.schedule-menu summary{line-height:42px}
.schedule-menu[open] .actions{margin:0 0 10px}
.phone-calendar{display:none}
#notice:empty{display:none}
@media(max-width:700px){
  header{padding:16px}h1{font-size:1.5rem}main{padding:12px}
  nav{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
  nav label,input,select{min-width:0}
  .view-tabs{grid-row:1;grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr}
  .schedule-menu{grid-column:1 / -1}
  .grid{grid-template-columns:minmax(0,1fr)}
  .day,.booking{padding:12px}
  .booking summary{min-height:44px;padding:10px 0}
  .roll label{display:grid;justify-content:stretch}
  .roll select,.booking .actions button{width:100%}
  dialog{padding:16px;max-height:85dvh}
  .calendar-frame,.week-controls,.calendar-legend{display:none}
  .phone-calendar{display:block}
  .day-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  .phone-time-grid{display:grid;grid-template-columns:42px minmax(0,1fr);background:white;border:1px solid #d2dfec;border-radius:10px}
  .phone-clock,.phone-time-column{position:relative}
  .phone-clock span{position:absolute;left:0;right:4px;padding-top:3px;text-align:right;font-size:.72rem;color:#4b6380;white-space:nowrap}
  .phone-time-column{border-left:1px solid #d2dfec;background:repeating-linear-gradient(to bottom,#e7eef6 0 1px,transparent 1px var(--hour-height))}
  .phone-event{position:absolute;display:block;min-height:0;padding:3px 5px;border:1px solid white;border-radius:6px;text-align:left;background:var(--event-bg);color:var(--event-ink);font-size:.76rem;line-height:1.15;overflow:hidden;overflow-wrap:anywhere}
  .phone-event strong,.phone-event-detail{display:block}
  .phone-event-detail{margin-top:2px}
  .phone-event:focus-visible{z-index:1;outline:2px solid #102941;outline-offset:-2px}
}
.user-card p{overflow-wrap:anywhere}.user-colour{display:inline-block;padding:5px 8px;border-radius:6px;background:var(--event-bg);color:var(--event-ink)}
.member-list{margin-top:12px}
[hidden]{display:none!important}.repeat-warning{padding:10px;border-radius:8px;background:#fff0d8;color:#684008}
.attendance-stats{display:grid;grid-template-columns:1fr auto;gap:8px;margin:0}.attendance-stats dd{margin:0;font-weight:700}
</style>
</head>
<body>
<header><small>Max Results Personal Training</small><h1>Staff Schedule</h1></header>
<main><p id="notice" role="status" aria-live="polite"></p><div id="app"></div></main>
<dialog id="bookingDialog"></dialog>
<script type="module" src="./app.js?v=member-reschedule-1"></script>
</body></html>
